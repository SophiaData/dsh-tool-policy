# dsh-tool-policy 的默认策略，随 bundle 装进 profile。
#
# action: deny —— 直接拦下，模型看到“调用未执行，不要重试”；
# action: ask  —— 走 DSH 审批面板，用户当场批准才执行；会话 approval 策略为 never 时等同拒绝。
- insert:
    - id: tool-policy
      name: dsh-tool-policy
      config:
        # 规则自身抛错时的兜底：allow 放行（默认，避免规则 bug 卡死日常操作），deny 拦截。
        onError: allow
        rules:
          - id: data-mcp-write
            tools:
              - mcp__data-mcp__execute_ddl
              - mcp__data-mcp__update_script_file
            action: deny
            reason: 生产 DDL / 节点脚本写入必须由用户手工执行
            displayReason:
              en: This tool writes production state. Run it yourself instead.
              zh: 该工具会改生产状态，请由你手工执行。
          # Cookie 刷新是用户侧运维动作，批准一次即可；直接禁掉会阻断 get-dataworks-cookie 流程。
          - id: data-mcp-cookie
            tools:
              - mcp__data-mcp__update_cookie
            action: ask
            reason: 更新 DataWorks Cookie 属于凭据写入，需要用户批准
            displayReason:
              en: This call writes DataWorks credentials. Approve only when you are refreshing the cookie.
              zh: 该调用会写入 DataWorks 凭据，只有你在刷新 Cookie 时才批准。
          - id: odps-write
            tools:
              - mcp__maxcompute-direct__*
              - mcp__maxcompute-mcp__*
            pattern: 'insert_values|create_table|update_table'
            action: deny
            reason: MaxCompute 建表 / 写入 / 改表必须由用户手工执行
          # Holo 生产库同理：只读查询照常走，DDL / DML 关键字命中才问。
          - id: hologres-write-sql
            tools:
              - mcp__hologres-direct__*
              - mcp__hologres-mcp__*
            pattern: '\b(insert\s+into|update\s+\S+\s+set|delete\s+from|create\s+(table|schema|view|index)|drop\s+(table|schema|view|index)|alter\s+table|truncate\s+table|grant\s+|revoke\s+)\b'
            action: ask
            reason: Hologres DDL / DML 会改动生产数据，需要用户批准
            displayReason:
              en: This SQL writes to a production Hologres database. Approve only if you asked for it.
              zh: 这段 SQL 会改生产 Hologres 数据，只有你确实要求时再批准。
          - id: publish-commands
            tools:
              - pwsh
              - bash
              - terminal_send
              - run_code
            pattern: 'publish|deploy|updateVertex|updateNode|updateScriptFile|backfill|发布|回填'
            action: ask
            reason: 发布 / 部署 / 回填属于生产写动作，需要用户当场批准
            displayReason:
              en: This command publishes or writes production state. Approve only if you asked for it.
              zh: 该命令会发布或改动生产状态，只有你确实要求时再批准。
